# XAUUSD data layer configuration.
# No paths or dates are hardcoded in code; everything lives here or on the CLI.

paths:
  # Root for all persisted data. Override with the XAU_DATA_ROOT environment
  # variable, which takes precedence over this value.
  #
  # DURABILITY: this container is ephemeral. Anything under data_root is lost
  # when the session ends unless data_root points at a mounted persistent
  # volume. See storage/README.md for the options.
  data_root: ./data

symbol:
  name: XAUUSD
  # Dukascopy stores integer prices; divide by 10**point_digits.
  point_digits: 3
  # Sanity band used by the validator to catch a wrong point_digits.
  plausible_price_range: [800.0, 6000.0]

timeframes: [M1, M5, M15, H1]

ingest:
  dukascopy:
    base_url: https://datafeed.dukascopy.com/datafeed
    # Dukascopy's month path component is ZERO-INDEXED (January = 00).
    month_zero_indexed: true
    requests_per_second: 0.5
    max_concurrency: 2
    max_attempts: 20
    backoff_base_seconds: 2.0
    backoff_max_seconds: 20.0
    connect_timeout_seconds: 25.0
    read_timeout_seconds: 60.0
    # Keep the raw payloads so a decoder fix can be replayed without refetching.
    keep_raw: true

  context:
    # Every series must declare how publication_time is derived. A config that
    # sets publication_time == observation_time is rejected at load.
    series:
      US10Y:
        source: fred
        source_series_id: DGS10
        publication: {rule: vintage, tz: America/New_York, at: "16:15"}
      DFII10:
        source: fred
        source_series_id: DFII10
        publication: {rule: vintage, tz: America/New_York, at: "16:15"}
      VIX:
        source: fred
        source_series_id: VIXCLS
        publication: {rule: market_close, tz: America/Chicago, at: "15:15"}
      SPX:
        source: fred
        source_series_id: SP500
        publication: {rule: market_close, tz: America/New_York, at: "16:00"}
      WTI:
        source: fred
        source_series_id: DCOILWTICO
        publication: {rule: vintage, tz: America/New_York, at: "16:30"}
      DXY:
        source: fred
        source_series_id: DTWEXBGS
        publication: {rule: vintage, tz: America/New_York, at: "16:15"}
        note: >-
          Trade-weighted broad dollar index, not ICE DXY, which is licensed.
          Different basket and daily only. Flagged in the schema README.
    safety_lag_seconds: 0

  calendar:
    sources: []          # CSV import path or weekly archiver; none configured yet

# Transaction costs. NOTHING in the codebase may hardcode a dollar cost.
# Spread is always read PER FILL from the bar being filled on; only the
# slippage adder lives here, because it is a modelling assumption rather than
# an observation.
#
# Measured 2021-01..2026-09: mean spread runs 0.32 to 1.03 USD/oz as gold goes
# from 1700 to 5000, so absolute spread scales with price. Relative cost is
# stable at 1.67-2.20 bps with no trend. Any constant in dollars is a window
# artifact and will be wrong in another regime.
costs:
  slippage_per_side: 0.03      # USD/oz, added to each fill, adverse
  # Optional relative floor so slippage scales with price regime too.
  # Effective slippage = max(slippage_per_side, price * slippage_bps / 10000).
  slippage_bps: 0.0

# Triple-barrier labelling. Barriers in ATR, never dollars.
#
# Defaults chosen by measurement, not convention. A 1.0 ATR stop on M15 gives a
# MEDIAN HOLD OF 3 BARS (45 minutes) with only 3.9% of labels inside the stated
# 4-12h window: the stop is hit long before the thesis plays out. Sweep over the
# full history:
#
#   stop/target   median bars   in 16-48 bars   stop-outs
#     1.0 / 1.5         3            3.9%         60.6%
#     2.0 / 3.0         9           28.0%         49.0%
#     3.0 / 4.5        16           50.2%         40.9%
#     4.0 / 6.0        21           63.6%         33.6%   <- default
#     5.0 / 7.5        26           71.4%         27.4%
#     6.0 / 9.0        30           76.0%         21.9%
#
# 4.0/6.0 centres the holding period in the window (p25 11, p75 35 bars) while
# keeping the stop binding on a third of labels. Wider barriers push the exit
# decision onto the time limit, which makes the stop decorative.
labeling:
  target_atr: 6.0
  stop_atr: 4.0
  max_bars: 48                 # 12h at M15
  min_bars: 16                 # 4h at M15
  atr_period: 14

walk_forward:
  n_blocks: 6                  # equal BLOCKS, not folds: 6 blocks -> 5 folds
  embargo_bars: 96             # one trading day, on top of purging

join:
  context:
    key: publication_time      # the only legal value
    allow_exact_matches: false # strict: published AT bar open is not yet usable

quality:
  spike_sigma: 8.0
  min_tick_count: {M1: 1, M5: 3, M15: 5, H1: 20}
  # Relative, not absolute: 25 USD was ~14 bps at 1800 and ~5 bps at 5000.
  max_spread_bps: 50.0
  context_staleness_days: 5
  fail_on: error
